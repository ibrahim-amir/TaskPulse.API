<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in to TaskPulse</h1>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="username" />
    <p class="field-error" *ngIf="email.invalid && email.touched">
      Enter a valid email address.
    </p>

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    <p class="field-error" *ngIf="password.invalid && password.touched">
      Password must be at least 8 characters.
    </p>

    <label class="remember-me">
      <input type="checkbox" formControlName="rememberMe" />
      Remember me
    </label>

    <p class="form-error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
